name: Secret demo
on: workflow_dispatch
jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
      APP_ENV: ${{ vars.APP_ENV }}
    steps:
      - name: Verifier la presence du secret
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "secret absent"
            exit 1
          fi
      - name: Afficher la longueur
        run: echo "longueur du secret = ${#DEMO_TOKEN}"
      - name: Essayer d'afficher la valeur
        run: echo "valeur du secret = $DEMO_TOKEN"
      - name: Afficher la variable
        run: echo "APP_ENV = $APP_ENV"